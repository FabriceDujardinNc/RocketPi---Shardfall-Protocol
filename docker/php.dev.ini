; RocketPi — overrides PHP pour le mode dev
; Mounté par-dessus docker/php.ini via docker-compose.override.yml
;
; Sans ces overrides, opcache.validate_timestamps=0 (config prod) fait que
; php-fpm garde les vieilles versions des classes en RAM même après un
; bind-mount fresh. Chaque édition de controller doit alors être suivie
; d'un `docker compose restart laravel-app`, ce qui est insupportable.
;
; En dev, on garde l'opcache actif (cache des classes compilées en mémoire)
; mais on fait stat() les fichiers à chaque hit pour détecter les edits.

[opcache]
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.jit = off

[PHP]
display_errors = On
display_startup_errors = On
log_errors = On
