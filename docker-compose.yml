name: rocketpi

# ── Base configuration — partagée prod et dev ─────────────────────
# docker compose up            → utilise ce fichier + docker-compose.override.yml (dev auto)
# docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d   → prod

services:

  laravel-app:
    build:
      context: .
      dockerfile: docker/Dockerfile.laravel
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL:-http://localhost}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-rocketpi}
      DB_USERNAME: ${MYSQL_USER:-rocketpi}
      DB_PASSWORD: ${MYSQL_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
    volumes:
      - app_storage:/var/www/html/storage
      - app_cache:/var/www/html/bootstrap/cache
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./docker/nginx/laravel.conf:/etc/nginx/conf.d/default.conf:ro
      - app_storage:/var/www/html/storage:ro
      - ./public:/var/www/html/public:ro
    depends_on:
      - laravel-app
    networks:
      - internal
      - proxy
    expose:
      - "80"

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootsecret}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-rocketpi}
      MYSQL_USER: ${MYSQL_USER:-rocketpi}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-secret}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/rocketpi.cnf:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci

  phpmyadmin:
    image: phpmyadmin:5.2
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    depends_on:
      - mysql
    networks:
      - internal
      - proxy
    expose:
      - "80"

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  queue-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.laravel
    restart: unless-stopped
    command: php artisan horizon
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY}
      DB_HOST: mysql
      DB_DATABASE: ${MYSQL_DATABASE:-rocketpi}
      DB_USERNAME: ${MYSQL_USER:-rocketpi}
      DB_PASSWORD: ${MYSQL_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      QUEUE_CONNECTION: redis
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      - laravel-app
      - redis
    networks:
      - internal

  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile.laravel
    restart: unless-stopped
    command: >
      bash -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY}
      DB_HOST: mysql
      DB_DATABASE: ${MYSQL_DATABASE:-rocketpi}
      DB_USERNAME: ${MYSQL_USER:-rocketpi}
      DB_PASSWORD: ${MYSQL_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      - laravel-app
      - mysql
    networks:
      - internal

volumes:
  mysql_data:
  redis_data:
  app_storage:
  app_cache:

networks:
  internal:
    driver: bridge
    internal: true
  proxy:
    external: true
    name: proxy
