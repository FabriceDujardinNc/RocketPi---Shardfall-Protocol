server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # ── Security headers ──────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ── Gzip compression ──────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/x-javascript
        application/json application/xml application/rss+xml
        image/svg+xml font/woff font/woff2;

    # ── Static assets (Vite build) — long cache ───────────────────
    # Les fichiers Vite ont des hashes dans leur nom → cache infini safe
    location ~* ^/build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;

        # Serve brotli if available, fallback to gzip
        location ~* \.br$ {
            add_header Content-Encoding br;
            add_header Content-Type application/javascript;
        }
        location ~* \.gz$ {
            add_header Content-Encoding gzip;
            add_header Content-Type application/javascript;
        }
    }

    # ── Unity WebGL assets ────────────────────────────────────────
    # Les builds Unity sont servis depuis /game/
    # Headers spécifiques pour SharedArrayBuffer (Photon Fusion)
    location ~* ^/game/ {
        root /var/www/html/public;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;

        # Requis pour Unity WebGL + SharedArrayBuffer (multijoueur)
        add_header Cross-Origin-Opener-Policy "same-origin";
        add_header Cross-Origin-Embedder-Policy "require-corp";

        # Brotli (.br)
        location ~* \.wasm\.br$ {
            add_header Content-Encoding br;
            add_header Content-Type application/wasm;
        }
        location ~* \.js\.br$ {
            add_header Content-Encoding br;
            add_header Content-Type application/javascript;
        }
        location ~* \.data\.br$ {
            add_header Content-Encoding br;
            add_header Content-Type application/octet-stream;
        }

        # Gzip (.gz)
        location ~* \.wasm\.gz$ {
            add_header Content-Encoding gzip;
            add_header Content-Type application/wasm;
        }
        location ~* \.js\.gz$ {
            add_header Content-Encoding gzip;
            add_header Content-Type application/javascript;
        }
        location ~* \.data\.gz$ {
            add_header Content-Encoding gzip;
            add_header Content-Type application/octet-stream;
        }

        # Mime types Unity
        location ~* \.wasm$ { add_header Content-Type application/wasm; }
        location ~* \.unityweb$ { add_header Content-Type application/octet-stream; }
    }

    # ── Fonts & images — medium cache ─────────────────────────────
    location ~* \.(woff|woff2|ttf|eot|svg|ico|png|jpg|jpeg|gif|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── Laravel routing ───────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── PHP-FPM ───────────────────────────────────────────────────
    location ~ \.php$ {
        fastcgi_pass laravel-app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Timeouts (jobs longs : export, gacha batch)
        fastcgi_read_timeout 120;
        fastcgi_send_timeout 120;

        # Buffer sizing pour éviter les disk writes sur les grosses réponses
        fastcgi_buffer_size 32k;
        fastcgi_buffers 8 16k;
    }

    # ── Block sensitive files ─────────────────────────────────────
    location ~ /\.(env|git|htaccess) { deny all; return 404; }
    # NOTE : `storage` retire du deny — public/storage est le symlink Laravel
    # vers storage/app/public (assets 3D, uploads admin, etc.). On garde le
    # deny sur bootstrap/cache (compiled views) et vendor (Composer).
    location ~ ^/(bootstrap/cache|vendor)/ { deny all; return 404; }

    # ── Client max body (uploads admin) ──────────────────────────
    client_max_body_size 64M;
}
