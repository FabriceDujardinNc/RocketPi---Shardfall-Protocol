# Dev overrides — auto-merged by: docker compose up
# Code monté en volume, Mailpit, Vite HMR, ports DB/Redis exposés localement.

services:

  laravel-app:
    build:
      dockerfile: docker/Dockerfile.laravel.dev
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_ENCRYPTION: "null"
      MAIL_FROM_ADDRESS: "noreply@rocketpi.local"
    volumes:
      - .:/var/www/html:delegated
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache

  nginx:
    volumes:
      - ./docker/nginx/laravel.conf:/etc/nginx/conf.d/default.conf:ro
      - ./storage:/var/www/html/storage:ro
      - ./public:/var/www/html/public:ro

  mysql:
    ports:
      - "127.0.0.1:3307:3306"

  redis:
    ports:
      - "127.0.0.1:6380:6379"

  queue-worker:
    build:
      dockerfile: docker/Dockerfile.laravel.dev
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
    volumes:
      - .:/var/www/html:delegated

  scheduler:
    build:
      dockerfile: docker/Dockerfile.laravel.dev
    environment:
      APP_ENV: local
    volumes:
      - .:/var/www/html:delegated

  # ── Vite HMR server ──────────────────────────────────────────────
  # Hot Module Replacement pour React + Tailwind.
  # La lame directive @vite() lit public/hot pour l'URL du dev server.
  # Le navigateur se connecte directement à localhost:5173.
  vite:
    build:
      context: .
      dockerfile: docker/Dockerfile.laravel.dev
    command: npm run dev -- --host 0.0.0.0 --port 5173
    volumes:
      - .:/var/www/html:delegated
    ports:
      - "127.0.0.1:5173:5173"
    networks:
      - internal

  # ── Mailpit — capture d'emails en dev ────────────────────────────
  # UI web : http://localhost:8025
  # SMTP : localhost:1025 (ou mailpit:1025 depuis les conteneurs)
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    expose:
      - "1025"
    networks:
      - internal
      - proxy
