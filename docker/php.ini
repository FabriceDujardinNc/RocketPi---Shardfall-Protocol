; RocketPi — PHP 8.5 Configuration

[PHP]
; Upload limits (Unity WebGL builds peuvent être grands)
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 60
max_input_time = 60
memory_limit = 256M

; Timezone
date.timezone = UTC

; Error handling (désactivé en prod, géré par Laravel)
display_errors = Off
log_errors = On
error_log = /var/log/php/error.log

; Session (Redis en prod — via config Laravel)
session.gc_maxlifetime = 7200

[opcache]
; OPcache critique pour performance PHP en production
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0   ; 0 = pas de stat() sur les fichiers (prod)
opcache.revalidate_freq = 0
opcache.fast_shutdown = 1
opcache.jit = tracing
opcache.jit_buffer_size = 128M

[mbstring]
mbstring.internal_encoding = UTF-8

[mysqlnd]
; Rapport de statistiques MySQL natif
mysqlnd.collect_statistics = On
mysqlnd.collect_memory_statistics = Off
