; Supervisor — RocketPi queue worker & scheduler
; Utilisé dans les conteneurs queue-worker et scheduler dédiés.
; Séparation: laravel-app (PHP-FPM) / queue-worker / scheduler = isolation des pannes.

[supervisord]
nodaemon = true
logfile  = /var/log/supervisor/supervisord.log
pidfile  = /var/run/supervisord.pid
loglevel = warn

; ── Queue worker (Laravel Horizon) ────────────────────────────────
; Horizon gère dynamiquement les workers Redis basé sur la charge.
; On lance un unique process Horizon qui spawne ses propres workers.
[program:horizon]
command         = php /var/www/html/artisan horizon
directory       = /var/www/html
autostart       = true
autorestart     = true
user            = www-data
redirect_stderr = true
stdout_logfile  = /var/log/supervisor/horizon.log
stopwaitsecs    = 60    ; Attend que les jobs en cours finissent

; ── Scheduler (cron Laravel) ──────────────────────────────────────
; Lance `artisan schedule:run` chaque minute — leaderboard resets,
; daily login rewards, battle pass expirations.
[program:scheduler]
command         = bash -c "while true; do php /var/www/html/artisan schedule:run --no-interaction >> /var/log/supervisor/scheduler.log 2>&1; sleep 60; done"
directory       = /var/www/html
autostart       = true
autorestart     = true
user            = www-data
redirect_stderr = true
stdout_logfile  = /var/log/supervisor/scheduler.log
